name: Report
description: Report a bug or suggest a feature
body:
  - type: markdown
    attributes:
      value: |
        ### Important
        Before reporting a new issue, please check if it already exists in the [issue tracker](https://github.com/duhs0011/MacPhoneInput/issues).
        
        Please describe whether the problem affects keyboard input, trackpad control, Bluetooth pairing, or input switching.
   
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      description: Please verify the following before submitting.
      options:
        - label: I have checked the issue tracker and I confirm this is NOT a known issue in this project.
          required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide the app version, Mac model, macOS version, iPhone model, and iOS version.
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the issue is.
    validations:
      required: true
