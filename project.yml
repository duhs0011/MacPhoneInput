name: MacPhoneInput
options:
  bundleIdPrefix: local.macphoneinput
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"

targets:
  MacPhoneInput:
    type: application
    platform: macOS
    sources:
      - BTRemote/AccessibilityPermission.swift
      - BTRemote/AppSettings.swift
      - BTRemote/BTRemoteApp.swift
      - BTRemote/DirectInputController.swift
      - BTRemote/GlobalHotKey.swift
      - BTRemote/HIDInput.swift
      - BTRemote/L10n.swift
      - BTRemote/MacPhoneInputView.swift
      - BTRemote/LowEnergy/HIDPeripheral.swift
      - BTRemote/LowEnergy/HIDProfile.swift
      - BTRemote/LowEnergy/HIDReports.swift
      - path: BTRemote/Assets.xcassets
        buildPhase: resources
      - path: BTRemote/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: BTRemote/InfoPlist.xcstrings
        buildPhase: resources
      - path: BTRemote/Localizable.xcstrings
        buildPhase: resources
      - path: BTRemote/entitlements.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macphoneinput.app
        PRODUCT_NAME: MacPhoneInput
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BTRemote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BTRemote/entitlements.plist
  MacPhoneInputTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MacPhoneInput
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macphoneinput.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacPhoneInput:
    build:
      targets:
        MacPhoneInput: all
        MacPhoneInputTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacPhoneInputTests
    archive:
      config: Release
